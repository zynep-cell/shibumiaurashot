<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shibumi Aura Shot Arşivi</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FDFBF7; 
            --text-color: #2C2C2C; 
            --accent-color: #D4AF37; 
            --white-space: 40px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            padding: var(--white-space);
            max-width: 1400px;
            margin: 0 auto;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--accent-color);
            position: relative;
        }

        header p {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 500;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 3px;
        }

        .date-display {
            position: absolute;
            right: 0;
            bottom: 20px;
            font-size: 0.9rem;
            font-style: italic;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 60px;
            margin-bottom: 60px;
            align-items: start; /* Sol panelin sağ panelle birlikte uzamasını engeller */
        }

        /* Sol Panel (Sticky) */
        .vision-board {
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 40px;
        }

        .image-upload-box {
            border: 1px dashed var(--accent-color);
            height: 500px; /* Sabit bir yükseklik verildi ki sünmesin */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            background-color: #fff;
        }

        .image-upload-box:hover {
            background-color: #faf8f2;
        }

        .image-upload-box input {
            display: none;
        }

        .image-upload-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        .image-upload-box span {
            font-family: 'Playfair Display', serif;
            color: var(--accent-color);
            font-size: 1.2rem;
            text-align: center;
            padding: 10px;
            letter-spacing: 1px;
            z-index: 1;
        }

        .remove-img-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #d9534f;
            border: 1px solid #d9534f;
            padding: 5px 15px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            display: none;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .remove-img-btn:hover {
            background-color: #d9534f;
            color: #fff;
        }

        /* Sağ Panel: Dinamik Form */
        .dynamic-form {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: var(--text-color);
            border-left: 3px solid var(--accent-color);
            padding-left: 10px;
        }

        input[type="text"], input[type="url"], textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            color: var(--text-color);
            transition: border-color 0.3s ease;
            resize: vertical;
        }

        input[type="text"]:focus, input[type="url"]:focus, textarea:focus {
            outline: none;
            border-bottom-color: var(--accent-color);
        }

        textarea {
            min-height: 40px;
            overflow: hidden;
        }

        .script-font {
            font-family: 'Great Vibes', cursive !important;
            font-size: 1.8rem !important;
            color: var(--accent-color) !important;
            line-height: 1.2;
        }

        /* Link Alanı Düzenlemeleri */
        .link-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .remove-link-btn {
            background: none;
            border: none;
            color: #bbb;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.2s ease;
            padding: 0 5px;
        }

        .remove-link-btn:hover {
            color: #d9534f;
            transform: scale(1.1);
        }

        .add-link-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            margin-top: 5px;
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
            width: fit-content;
        }

        .add-link-btn:hover {
            opacity: 0.7;
        }

        /* Gurme CEO Yorumu */
        .ceo-section {
            background-color: #fff;
            padding: 40px;
            border: 1px solid var(--accent-color);
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            font-size: 2rem;
            color: #ddd;
            cursor: pointer;
            border: none;
            padding: 0;
            transition: color 0.2s ease;
        }

        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: var(--accent-color);
        }

        .btn-save {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 15px 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: block;
            margin: 0 auto;
        }

        .btn-save:hover {
            background-color: var(--accent-color);
        }

        /* Geçmiş Shotlar Galerisi */
        .gallery-section {
            margin-top: 80px;
            border-top: 1px solid #ddd;
            padding-top: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
            margin-top: 40px;
        }

        .shot-card {
            background-color: #fff;
            border: 1px solid #eee;
            padding: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .shot-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .delete-card-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #bbb;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .delete-card-btn:hover {
            color: #d9534f;
        }

        .shot-card h3 {
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            padding-right: 30px; 
        }

        .shot-card p {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .shot-card .script-font {
            font-size: 1.5rem !important;
            margin-top: 15px;
            margin-bottom: 15px;
            display: block;
            white-space: pre-wrap;
        }

        .shot-image-container {
            margin-top: auto;
            padding-top: 15px;
        }

        .shot-image-container img {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: cover;
            border: 1px solid #eee;
        }

        .shot-links-list {
            list-style-type: none;
            margin-top: 10px;
            padding-left: 0;
        }

        .shot-links-list li {
            margin-bottom: 5px;
        }

        .shot-links-list a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .shot-links-list a:hover {
            color: var(--text-color);
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; }
            .date-display { position: static; display: block; margin-top: 20px; }
            .vision-board { position: static; }
            .image-upload-box { height: 350px; }
        }
    </style>
</head>
<body>

    <header>
        <p>BÜYÜLÜ MUTFAK</p>
        <h1>SHIBUMI AURA SHOT ARŞİVİ</h1>
        <div class="date-display" id="todayDate"></div>
    </header>

    <main>
        <!-- Sol Panel -->
        <section class="vision-board">
            <div class="image-upload-box" id="uploadBox">
                <span id="collageText">İlham Kolajı (Görsel Ekle)</span>
                <input type="file" id="collageImg" accept="image/*" onchange="previewImage(this)">
                <img id="collagePreview" src="" alt="Kolaj Görseli" onclick="document.getElementById('collageImg').click()">
                <button class="remove-img-btn" id="removeImgBtn" onclick="removeImage(event)">✖ Kaldır</button>
            </div>
        </section>

        <!-- Sağ Panel -->
        <section class="dynamic-form">
            <div class="form-group">
                <label>Aura Shot Adı</label>
                <input type="text" id="shotName" placeholder="Örn: Zamanın İzafiyeti" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>İçerik</label>
                <textarea id="shotContent" oninput="autoResize(this)" placeholder="Bu kokteylin içinde neler var? (Hormonlar, frekanslar, aromalar...)"></textarea>
            </div>

            <div class="form-group">
                <label>Bardak (Fiziksel Duruş)</label>
                <textarea id="shotGlass" oninput="autoResize(this)" placeholder="Beden dili ve duruş notları..."></textarea>
            </div>
            
            <!-- Tarif ve İnanç Cümlesi İkiye Ayrıldı -->
            <div class="form-group">
                <label>Pipet (Aksiyon / Tarif)</label>
                <textarea id="shotStraw" oninput="autoResize(this)" placeholder="Bu shot'ın pratiği, uygulaması nasıldır?"></textarea>
            </div>

            <div class="form-group">
                <label>İnanç Cümlesi</label>
                <textarea id="shotBelief" class="script-font" oninput="autoResize(this)" placeholder="Buraya yazılanlar zihne kazınır..." autocomplete="off"></textarea>
            </div>

            <!-- Bağlantılar -->
            <div class="form-group" id="linksContainer">
                <label>İlham Bağlantıları (Pinler, Şarkılar vb.)</label>
                <div class="link-wrapper">
                    <input type="url" class="link-input" placeholder="https://..." autocomplete="off">
                    <button type="button" class="remove-link-btn" onclick="this.parentElement.remove()" title="Sil">✖</button>
                </div>
                <div class="link-wrapper">
                    <input type="url" class="link-input" placeholder="https://..." autocomplete="off">
                    <button type="button" class="remove-link-btn" onclick="this.parentElement.remove()" title="Sil">✖</button>
                </div>
                <div class="link-wrapper">
                    <input type="url" class="link-input" placeholder="https://..." autocomplete="off">
                    <button type="button" class="remove-link-btn" onclick="this.parentElement.remove()" title="Sil">✖</button>
                </div>
            </div>
            <button class="add-link-btn" onclick="addLinkField()">+ Yeni Bağlantı Ekle</button>
        </section>
    </main>

    <!-- Gurme CEO Yorumu -->
    <section class="ceo-section">
        <div class="form-group">
            <label>Zaze'nin Tadım Notları</label>
            <textarea id="ceoNotes" oninput="autoResize(this)" placeholder="Bu shot ruhta nasıl bir his bıraktı?"></textarea>
        </div>
        <div class="form-group">
            <label style="border:none; padding:0;">Frekans Puanı</label>
            <div class="star-rating">
                <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
                <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
            </div>
        </div>
    </section>

    <button class="btn-save" onclick="saveShot()">Arşive Ekle</button>

    <!-- Geçmiş Shotlar Galerisi -->
    <section class="gallery-section">
        <h2 style="text-align: center; color: var(--accent-color); margin-bottom: 20px;">Geçmiş Shotlar</h2>
        <div class="gallery-grid" id="galleryGrid">
            <!-- JavaScript ile eklenecek -->
        </div>
    </section>

    <script>
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('todayDate').innerText = new Date().toLocaleDateString('tr-TR', options);

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        let uploadedImage = "";
        
        document.getElementById('uploadBox').addEventListener('click', function(e) {
            if(e.target.id === 'uploadBox' || e.target.id === 'collageText') {
                document.getElementById('collageImg').click();
            }
        });

        // OTOMATİK SIKIŞTIRMA (CANVAS KULLANARAK)
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; // Genişlik maksimum 800px olsun
                        const MAX_HEIGHT = 1000;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // %70 kalite ile jpeg olarak sıkıştırır
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7); 
                        
                        document.getElementById('collagePreview').src = compressedDataUrl;
                        document.getElementById('collagePreview').style.display = 'block';
                        document.getElementById('collageText').style.display = 'none';
                        document.getElementById('removeImgBtn').style.display = 'block';
                        
                        uploadedImage = compressedDataUrl;
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeImage(event) {
            event.stopPropagation();
            document.getElementById('collagePreview').src = '';
            document.getElementById('collagePreview').style.display = 'none';
            document.getElementById('collageText').style.display = 'block';
            document.getElementById('removeImgBtn').style.display = 'none';
            document.getElementById('collageImg').value = '';
            uploadedImage = "";
        }

        function addLinkField() {
            const container = document.getElementById('linksContainer');
            const wrapper = document.createElement('div');
            wrapper.className = 'link-wrapper';
            const newInput = document.createElement('input');
            newInput.type = 'url';
            newInput.className = 'link-input';
            newInput.placeholder = 'https://...';
            newInput.autocomplete = 'off';
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'remove-link-btn';
            removeBtn.innerHTML = '✖';
            removeBtn.title = 'Sil';
            removeBtn.onclick = function() { wrapper.remove(); };
            wrapper.appendChild(newInput);
            wrapper.appendChild(removeBtn);
            container.appendChild(wrapper);
        }

        function saveShot() {
            const name = document.getElementById('shotName').value;
            const content = document.getElementById('shotContent').value;
            const glass = document.getElementById('shotGlass').value;
            const straw = document.getElementById('shotStraw').value;
            const belief = document.getElementById('shotBelief').value;
            const ceoNotes = document.getElementById('ceoNotes').value;
            const date = document.getElementById('todayDate').innerText;
            
            const linkInputs = document.querySelectorAll('.link-input');
            const links = [];
            linkInputs.forEach(input => {
                if(input.value.trim() !== "") {
                    let finalUrl = input.value.trim();
                    if(!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                        finalUrl = 'https://' + finalUrl;
                    }
                    links.push(finalUrl);
                }
            });
            
            let rating = 0;
            const stars = document.getElementsByName('rating');
            for(let star of stars) {
                if(star.checked) {
                    rating = star.value;
                    break;
                }
            }

            if(!name) {
                alert("Lütfen en azından bir Aura Shot Adı girin.");
                return;
            }

            const newShot = {
                id: Date.now(),
                date: date,
                name: name,
                content: content,
                glass: glass,
                straw: straw,
                belief: belief,
                ceoNotes: ceoNotes,
                rating: rating,
                image: uploadedImage,
                links: links
            };

            let shots = JSON.parse(localStorage.getItem('shibumiShots')) || [];
            shots.unshift(newShot);
            
            try {
                localStorage.setItem('shibumiShots', JSON.stringify(shots));
                renderGallery();
                resetForm();
            } catch (e) {
                alert("Sistemsel bir hata oluştu. Depolama alanı dolu olabilir.");
            }
        }

        function deleteShot(id) {
            if(confirm("Bu shot'ı arşivden tamamen silmek istediğine emin misin?")) {
                let shots = JSON.parse(localStorage.getItem('shibumiShots')) || [];
                shots = shots.filter(shot => shot.id !== id);
                localStorage.setItem('shibumiShots', JSON.stringify(shots));
                renderGallery();
            }
        }

        function resetForm() {
            document.getElementById('shotName').value = '';
            document.getElementById('shotContent').value = '';
            document.getElementById('shotContent').style.height = 'auto';
            document.getElementById('shotGlass').value = '';
            document.getElementById('shotGlass').style.height = 'auto';
            document.getElementById('shotStraw').value = '';
            document.getElementById('shotStraw').style.height = 'auto';
            document.getElementById('shotBelief').value = '';
            document.getElementById('shotBelief').style.height = 'auto';
            document.getElementById('ceoNotes').value = '';
            document.getElementById('ceoNotes').style.height = 'auto';
            
            const linksContainer = document.getElementById('linksContainer');
            linksContainer.innerHTML = `
                <label>İlham Bağlantıları (Pinler, Şarkılar vb.)</label>
                <div class="link-wrapper">
                    <input type="url" class="link-input" placeholder="https://..." autocomplete="off">
                    <button type="button" class="remove-link-btn" onclick="this.parentElement.remove()" title="Sil">✖</button>
                </div>
                <div class="link-wrapper">
                    <input type="url" class="link-input" placeholder="https://..." autocomplete="off">
                    <button type="button" class="remove-link-btn" onclick="this.parentElement.remove()" title="Sil">✖</button>
                </div>
                <div class="link-wrapper">
                    <input type="url" class="link-input" placeholder="https://..." autocomplete="off">
                    <button type="button" class="remove-link-btn" onclick="this.parentElement.remove()" title="Sil">✖</button>
                </div>
            `;

            const stars = document.getElementsByName('rating');
            for(let star of stars) star.checked = false;

            removeImage(new Event('reset'));
        }

        function renderGallery() {
            const gallery = document.getElementById('galleryGrid');
            gallery.innerHTML = '';
            let shots = JSON.parse(localStorage.getItem('shibumiShots')) || [];

            shots.forEach(shot => {
                let starsHTML = '★'.repeat(shot.rating) + '☆'.repeat(5 - shot.rating);
                
                let linksHTML = '';
                if(shot.links && shot.links.length > 0) {
                    linksHTML = '<ul class="shot-links-list">';
                    shot.links.forEach((link, index) => {
                        linksHTML += `<li><a href="${link}" target="_blank">Bağlantı ${index + 1} ↗</a></li>`;
                    });
                    linksHTML += '</ul>';
                }

                let imageHTML = '';
                if(shot.image) {
                    imageHTML = `<div class="shot-image-container"><img src="${shot.image}" alt="Kolaj Görseli"></div>`;
                }

                const card = document.createElement('div');
                card.className = 'shot-card';
                card.innerHTML = `
                    <button class="delete-card-btn" onclick="deleteShot(${shot.id})" title="Arşivden Sil">✖</button>
                    <p style="color: var(--accent-color); font-size: 0.8rem; text-align: right; margin-bottom: 10px;">${shot.date}</p>
                    <h3>${shot.name}</h3>
                    ${shot.content ? `<p><strong>İçerik:</strong> ${shot.content}</p>` : ''}
                    ${shot.glass ? `<p><strong>Bardak (Fiziksel Duruş):</strong> ${shot.glass}</p>` : ''}
                    ${shot.straw ? `<p><strong>Pipet (Aksiyon/Tarif):</strong> ${shot.straw}</p>` : ''}
                    ${shot.ceoNotes ? `<p><strong>Zaze'nin Notları:</strong> ${shot.ceoNotes}</p>` : ''}
                    <p style="color: var(--accent-color); letter-spacing: 2px; margin-bottom: 5px;">Frekans: ${starsHTML}</p>
                    ${linksHTML}
                    ${shot.belief ? `<p class="script-font">${shot.belief}</p>` : ''}
                    ${imageHTML}
                `;
                gallery.appendChild(card);
            });
        }

        window.onload = renderGallery;
    </script>
</body>
</html>
